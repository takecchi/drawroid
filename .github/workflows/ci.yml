name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` を明示で足す: GitHub の既定 `[opened, synchronize, reopened]` には含まれず、
    # 足し忘れると下の `if:` で draft の間 skip したまま、ready にしても run が1本も起きないため。
    types: [opened, synchronize, reopened, ready_for_review]

# 後勝ち: 同じ PR に新しい push が来たら古い run を取り消す。
# push（main）の run は取り消さない: マージの間隔が CI の所要時間より短いと、main の run が毎回途中で切られて1本も決着しないため。
# PR は元ブランチ名（head_ref）で、main は ref で群を作る。push の ref は `refs/heads/` から始まるので PR の群と交わらない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.head_ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    # job に `if:` を付けて draft の間 skip しない: GitHub は skipped の必須チェックを通過として扱い、
    # draft の間に立った run だけで自動マージが通ってしまうため（#103）。
    # draft の間は job を走らせ、検査をせずに失敗で終える。ready にした時点の run（ready_for_review）が本当の検査をする。
    runs-on: ubuntu-latest
    steps:
      - name: draft の間は検査をせずに失敗で終える
        id: draft
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::draft の PR では CI の検査を走らせない。ready にすると走る（#103）"
          exit 1

      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # 各 step に `!cancelled()` を付ける: 既定の `success()` だと前の失敗で後ろが skip され、1回の run で落ちた検査が1つしか見えないため。

      # 本文の編集（`edited`）では走らない: CI 全体を本文の書き換えのたびに回さないため。本文を直したら CI を再実行して確かめる。
      - run: pnpm check:no-attribution-trailers
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NO_ATTRIBUTION_TRAILERS_PR_NUMBER: ${{ github.event.pull_request.number }}

      - run: pnpm format:check
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' }}

      # build より前に置く: 鍵の重なった package.json は依存を黙って落とすので、その上での build・試験の結果は当てにならないため。
      - run: pnpm check:duplicate-json-keys
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' }}

      - run: pnpm build
        id: build
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' }}

      - run: pnpm typecheck
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' && steps.build.outcome == 'success' }}

      - run: pnpm lint
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' && steps.build.outcome == 'success' }}

      - run: pnpm test
        if: ${{ !cancelled() && steps.draft.outcome != 'failure' && steps.build.outcome == 'success' }}

  packed-install:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # ci ジョブの build と分けて、ここでも build する: 固める手順は web の build/client を写すので、job を跨いだ成果物の受け渡し（artifact）を持ち込まないため。
      - run: pnpm build

      # ワークスペースの中で起動しない: node_modules の上位探索で @drawroid/* や sharp が見えてしまい、固めたものだけで動くかを確かめられないため。
      # 固める・空のディレクトリへ npm install・起動・`/` と `/api/health` の確認まで scripts/check-packed-install.mjs が行う。
      - run: pnpm check:packed-install

      # 同じ job に足す: build 済みの成果物を使い回せ、job を分けると setup と build をもう一度払うため。固めて入れる道具は scripts/packed-install-core.mjs を共有し、tgz は step ごとに作り直す（step 間で受け渡さない）。
      # 外のサービスには繋がない: Forge と LLM は scripts/packed-conversation/ の偽物を 127.0.0.1 に立てる。実機の Forge・実際のモデルの挙動は確かめない。
      # 固めたものを起動し、会話 → 発言 → start_drawing → 進み具合 → 画像と評価 → 停止、と SSE の Last-Event-ID での再開を通す（全体の上限 120 秒）。
      - run: pnpm check:packed-conversation

  # packed-install とは別の job にする: あちらの step は会話の確かめで手が入りやすく、ここは並んで走らせて全体の待ちを延ばさないため。
  packed-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm build

      # 固めたものを起動し、ヘッドレスの Chrome で `/` を開く（M0「ブラウザで Web UI が開ける」）。会話の一覧が描かれ、CSS が効き、
      # 会話を1つ開けて、コンソールのエラー・失敗した読み込みが無いことを見る。
      # ブラウザは取得しない: ubuntu-latest に入っている Chrome を使う（scripts/check-packed-browser.mjs）。
      - run: pnpm check:packed-browser

      # 同じ job に足す: build 済みの成果物と Chrome を使い回せるため。偽の LLM と偽の Forge は scripts/packed-conversation/ の部品を使う。
      # 会話で頼み、思考と返答が流れること・進み具合のカード・止めるでターンが止まること・思考の途中の発言で割り込めること・人が画像を選べること（会話と「この画像で決める」ボタン）・
      # 再読み込みとサーバの立て直しのあとにログが戻ること（SSE の復帰）・狭い画面（390×844）でも流れる・止めるが動くことを、画面で見る。
      - run: pnpm check:packed-browser-conversation

      # 同じ job に足す: 長い会話（数百行）を置き場所へ直に書いてから開き、画面の外の行の描画を飛ばしても（content-visibility: auto）、
      # 末尾を追い続けること（#164）・ページの中の検索で古い発言が見つかること・読み上げの木に残ることを、画面で見る。
      - run: pnpm check:packed-browser-long-conversation
