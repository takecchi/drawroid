packages:
  - packages/*
  - apps/*

# vite が使う esbuild のネイティブ実体を入れるため
allowBuilds:
  esbuild: true

catalog:
  # typescript-eslint が TS 7（ネイティブコンパイラ）未対応のため 6 系に固定する
  typescript: ^6.0.3
  prettier: ^3.9.6
  # CI の実行系（Node 22）に合わせる
  '@types/node': ^22.20.1
  zod: ^4.4.3
  # 記憶のファイルの front matter（packages/storage-fs）。人間が手で書くので、自前の読み方ではなく YAML として読む
  yaml: ^2.9.1
  hono: ^4.13.5
  '@hono/node-server': ^2.1.0
  # Web UI（apps/web）。React Router v7 を SPA モード（ssr: false）で使う
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  react-router: ^7.18.2
  '@react-router/dev': ^7.18.2
  # SPA でもビルド時に要る。dependencies に無いと、react-router のビルドが package.json を書き換えて pnpm install を走らせる
  '@react-router/node': ^7.18.2
  isbot: ^5.2.1
  # Web UI のデータ取得（packages/swr）。ポーリングで画面を更新する
  swr: ^2.5.1
  vite: ^8.2.1
  # Web UI の部品の試験（apps/web）。部品の試験だけを jsdom で走らせる
  jsdom: ^30.1.2
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  '@testing-library/user-event': ^14.6.7
  # Web UI の見た目（packages/ui）。CSS ファーストの Tailwind v4 と、その Vite プラグイン。
  # apps/web と Storybook の Vite がそれぞれ `@tailwindcss/vite` を回す（2つは版を揃える）
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  # shadcn/ui（packages/ui）。`@import 'shadcn/tailwind.css'` の実体（`data-open:` などの
  # custom variant）であり、`shadcn add` の CLI でもある。版が固定されるので
  # `npx shadcn@latest`（毎回違う版が降ってくる）を避けられる
  shadcn: ^4.18.0
  # 統合パッケージ（`@radix-ui/react-*` を個別に入れない）。shadcn の radix 系スタイルが
  # `import { Checkbox } from 'radix-ui'` の形で吐くのでこれに揃える
  'radix-ui': ^1.6.7
  # shadcn が吐く部品の variant 定義（`cva`）
  'class-variance-authority': ^0.7.1
  # class 名の組み立て（`cn` = `twMerge(clsx(...))`）
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  # `animate-in` などの出入りの動き。色は1つも持たない
  'tw-animate-css': ^1.4.0
  # shadcn の iconLibrary（`components.json`）
  lucide-react: ^1.31.0
  # AI の返答の Markdown 表示（`packages/ui/src/components/markdown.tsx`。alteroid と同じ組）。文字列 → mdast → React の一方向だけに使い、
  # 生の HTML は要素にせず文字として描く。remark・rehype・react-markdown は入れない（書き戻し側や汎用の器を抱えないため）
  'mdast-util-from-markdown': ^2.0.3
  'mdast-util-gfm': ^3.1.0
  'mdast-util-newline-to-break': ^2.0.0
  'micromark-extension-gfm': ^3.0.0
  # Web UI のテーマの書体（`packages/ui/src/styles.css`）。**自前で配る**（画面を開くたびに外のフォント配信へ
  # 取りに行かない）。本文は IBM Plex Sans JP（日本語を含む）、ロゴは Michroma、等幅は IBM Plex Mono（alteroid と同じ組）
  '@fontsource/ibm-plex-sans-jp': ^5.3.0
  '@fontsource/michroma': ^5.3.0
  '@fontsource/ibm-plex-mono': ^5.3.0
  # 部品の見本帳（packages/ui の Storybook。根で `pnpm storybook`）。画面の成果物には
  # 入らない。3つは版を揃えること（`@storybook/react-vite` の peerDependencies が
  # `storybook` の同じ版を要求する）。アドオンは部品ごとの説明ページの `addon-docs` だけ
  storybook: ^10.6.0
  '@storybook/react-vite': ^10.6.0
  '@storybook/addon-docs': ^10.6.0

# `pnpm --filter <存在しないパッケージ名>` が黙って exit 0 を返すのを塞ぐ。
# `.npmrc` に置くと無視される（alteroid で実測済み）ので、ここに置く。
failIfNoMatch: true

# writeFromReadableStream が、塊を書くたびに次の読みを返して Promise の鎖を伸ばし、開いている SSE の接続1本ごとに、
# 送った塊の数だけ Promise を手放さない（2.1.4 でも同じ）。返り値は誰も使わないので `return` を外す1行だけ直す。
# 上流で直ったらパッチを外す。外れたことは apps/cli/src/listen.test.ts が赤で知らせる
patchedDependencies:
  '@hono/node-server@2.1.3': patches/@hono__node-server@2.1.3.patch
